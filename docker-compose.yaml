services:
  # ========================================================
  # INITIALIZATION SERVICE (Runs once to prepare host storage)
  # ========================================================
  init-volumes:
    image: alpine:latest
    container_name: mycloud_init_volumes
    user: "0:0"
    restart: "no"
    volumes:
      - ${DATA_DIR:-/srv/data/mycloud}:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Init] Creating storage directories..."
        mkdir -p /data/seafile/data /data/seafile/mariadb
        mkdir -p /data/immich/upload /data/immich/postgres /data/immich/models

        echo ">>> [Init] Setting ownership and permissions..."
        # Set database directory ownerships (UID/GID 999 for MariaDB & PostgreSQL)
        chown -R 999:999 /data/seafile/mariadb
        chmod -R 750 /data/seafile/mariadb

        chown -R 999:999 /data/immich/postgres
        chmod -R 700 /data/immich/postgres

        # Set shared read/write permissions for file and photo uploads
        chmod -R 775 /data/seafile/data /data/immich/upload /data/immich/models

        echo ">>> [Init] Storage volumes and permissions initialized successfully!"

  # ========================================================
  # SEAFILE SERVICES (Files and Documents)
  # ========================================================
  seafile:
    image: seafileltd/seafile-mc:latest
    container_name: seafile
    restart: unless-stopped
    environment:
      - DB_HOST=seafile-mariadb
      - DB_ROOT_PASSWD=${DB_MYSQL_ROOT_PASSWORD}
      - TIME_ZONE=${TZ:-UTC}
      - SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL}
      - SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD}
      - SEAFILE_SERVER_LETSENCRYPT=${SEAFILE_SERVER_LETSENCRYPT:-false}
      - SEAFILE_SERVER_HOSTNAME=${SEAFILE_SERVER_HOSTNAME}
    volumes:
      - ${SEAFILE_DATA_DIR:-${DATA_DIR:-/srv/data/mycloud}/seafile/data}:/shared
    networks:
      - shared_net
    ports:
      - "${MYCLOUD_IP:-127.0.0.1}:${SEAFILE_PORT:-9085}:80"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for MariaDB (seafile-mariadb:3306) to become ready..."
        python3 -c '
        import socket, time
        for _ in range(60):
            try:
                with socket.create_connection(("seafile-mariadb", 3306), timeout=2):
                    print(">>> MariaDB is accepting connections! Starting Seafile...")
                    break
            except Exception:
                time.sleep(2)
        else:
            print(">>> WARNING: MariaDB wait timeout reached. Proceeding with startup...")
        '
        exec /sbin/my_init -- /scripts/enterpoint.sh
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      seafile-mariadb:
        condition: service_healthy
      seafile-memcached:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  seafile-mariadb:
    image: mariadb:10.11
    container_name: seafile-mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_MYSQL_ROOT_PASSWORD}
    volumes:
      - ${SEAFILE_DB_DIR:-${DATA_DIR:-/srv/data/mycloud}/seafile/mariadb}:/var/lib/mysql
    networks:
      - shared_net
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  seafile-memcached:
    image: memcached:1.6-alpine
    container_name: seafile-memcached
    restart: unless-stopped
    entrypoint: memcached -m 256
    networks:
      shared_net:
        aliases:
          - memcached
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # IMMICH SERVICES (Photos and Videos)
  # ========================================================
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${IMMICH_UPLOAD_DIR:-${DATA_DIR:-/srv/data/mycloud}/immich/upload}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
      - DB_HOSTNAME=immich_postgres
      - REDIS_HOSTNAME=immich_redis
    networks:
      - shared_net
    ports:
      - "${MYCLOUD_IP:-127.0.0.1}:${IMMICH_PORT:-2283}:2283"
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      immich-redis:
        condition: service_healthy
      immich-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:2283/api/server-info/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - ${IMMICH_CACHE_DIR:-${DATA_DIR:-/srv/data/mycloud}/immich/models}:/cache
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
      - DB_HOSTNAME=immich_postgres
      - REDIS_HOSTNAME=immich_redis
    networks:
      - shared_net
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      immich-redis:
        condition: service_healthy
      immich-postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  immich-redis:
    container_name: immich_redis
    image: redis:6.2-alpine
    networks:
      - shared_net
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  immich-postgres:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${IMMICH_DB_DIR:-${DATA_DIR:-/srv/data/mycloud}/immich/postgres}:/var/lib/postgresql/data
    networks:
      - shared_net
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_DATABASE_NAME:-immich} -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 128mb
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_net:
    name: ${SHARED_NETWORK:-shared_net}
